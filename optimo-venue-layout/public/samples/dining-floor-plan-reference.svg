    <circle cx="240" cy="30" r="4.5"/>
    <circle cx="264" cy="30" r="4.5"/>
    <circle cx="288" cy="30" r="4.5"/>
  </g>

  <!-- Round guest tables — 3 / 2 / 3 grid; chairs gapped so ink stays separate -->
